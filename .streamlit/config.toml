[server]
maxUploadSize = 256
# Cần cho [[theme.fontFaces]] bên dưới: Streamlit chỉ phục vụ file trong
# `app/static/` khi cờ này bật. Thư mục được tính theo vị trí file script
# chính (`app/streamlit_app.py`), không theo thư mục đang đứng khi chạy.
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0E7C8C"
backgroundColor = "#F3F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#102033"

# Montserrat, tự phục vụ từ repo — KHÔNG gọi ra fonts.googleapis.com.
# App này chạy ở xưởng, nơi một request ra CDN nghĩa là trang hiện bằng font
# dự phòng, hoặc treo chờ timeout. Danh sách dự phòng vẫn giữ để trang đọc
# được ngay cả khi file font mất.
font = "Montserrat, sans-serif"
baseFontSize = 15

# Chỉ hai subset: `vietnamese` và `latin`. Các dải Cyrillic/Greek chiếm phần
# lớn dung lượng và không có chữ nào dùng đến. Mỗi weight cần hai bảng vì
# Google tách file theo subset.
[[theme.fontFaces]]
family = "Montserrat"
url = "app/static/fonts/montserrat-vietnamese-400.woff2"
weight = "400"
style = "normal"
unicodeRange = "U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB"

[[theme.fontFaces]]
family = "Montserrat"
url = "app/static/fonts/montserrat-latin-400.woff2"
weight = "400"
style = "normal"

